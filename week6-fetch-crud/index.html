<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 6 Fetch CRUD</title>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800">
    <div class="max-w-3xl mx-auto p-4">
      <h1 class="text-3xl font-bold mb-4">Posts CRUD</h1>

      <!-- Filter -->
      <div class="flex items-center gap-2 mb-4">
        <label for="userFilter" class="font-medium">Filter by user:</label>
        <select id="userFilter" class="border rounded px-2 py-1 bg-white"></select>
      </div>

      <!-- Create form -->
      <form id="createForm" class="bg-white rounded-lg shadow p-4 mb-6 space-y-2">
        <h2 class="font-semibold text-lg">New post</h2>
        <input id="newTitle" required placeholder="Title"
          class="w-full border rounded px-3 py-2" />
        <textarea id="newBody" required placeholder="Body" rows="3"
          class="w-full border rounded px-3 py-2"></textarea>
        <button id="createBtn" type="submit"
          class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded disabled:opacity-50">
          Create
        </button>
      </form>

      <!-- Status + list -->
      <div id="status"></div>
      <div id="list" class="space-y-3"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
